[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfe-analytics"
version = "0.1.0"
description = "Synthetic NF-e XML ingestion into PostgreSQL with dbt marts"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
dbt = ["dbt-postgres>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that require a running Postgres (set TEST_DATABASE_URL)",
]
