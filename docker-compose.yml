services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nfe
      POSTGRES_PASSWORD: nfe
      POSTGRES_DB: nfe
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfe"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
