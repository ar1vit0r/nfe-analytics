name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nfe
          POSTGRES_PASSWORD: nfe
          POSTGRES_DB: nfe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfe"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nfe:nfe@localhost:5432/nfe
      DATABASE_URL: postgresql://nfe:nfe@localhost:5432/nfe
      DBT_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,dbt]'
      - run: python -m pytest -q --tb=short
      - name: Generate and load 200 synthetic notes
        run: |
          python -m nfe_analytics.cli generate --n 200 --seed 42 --defect-rate 0.05
          python -m nfe_analytics.cli load data/xml
      - name: Build dbt models and tests
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-profile"
          cp dbt/profiles.yml.example "$RUNNER_TEMP/dbt-profile/profiles.yml"
          dbt build --project-dir dbt --profiles-dir "$RUNNER_TEMP/dbt-profile"
